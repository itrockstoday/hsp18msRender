name: Compile & Deploy Cellular ODFU Firmware

on:
  workflow_dispatch: # Enables manual "Run workflow" button in GitHub UI
  push:
    branches:
      - main
    paths:
      - 'firmware/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Board Index & Install STM32 Core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32
          arduino-cli lib install "Blues Wireless Notecard"

      - name: Compile Cygnet C++ Firmware to Binary
        run: |
          arduino-cli compile \
            --fqbn STMicroelectronics:stm32:Blues:pnum=CYGNET \
            --output-dir ./build \
            ./firmware/hsg18ms

      - name: Upload Binary to Notehub Host Firmware Pool
        run: |
          FIRMWARE_FILE=$(ls ./build/*.bin | head -n 1)
          FILENAME=$(basename $FIRMWARE_FILE)
          
          echo "Uploading $FILENAME to Notehub host firmware endpoint..."
          
          curl -X POST "https://api.notefile.net/v1/projects/${{ secrets.NOTEHUB_PROJECT_UID }}/firmware/host/$FILENAME" \
            -H "X-SESSION-TOKEN: ${{ secrets.NOTEHUB_AUTH_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$FIRMWARE_FILE"